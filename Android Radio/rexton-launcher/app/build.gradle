plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alvear.rexton'
    compileSdk 34

    defaultConfig {
        applicationId 'com.alvear.rexton'
        minSdk 21
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
